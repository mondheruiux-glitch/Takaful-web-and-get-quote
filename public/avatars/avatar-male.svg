  <path d="M33 56 L40 62 L47 56 L44 52 L40 54 L36 52Z" fill="#2563EB"/>
  <!-- Neck -->
  <rect x="34" y="50" width="12" height="10" rx="3" fill="#D4956A"/>
  <!-- Head -->
  <circle cx="40" cy="42" r="17" fill="#D4956A"/>
  <!-- Hair - short male style -->
  <path d="M23 38 Q24 22 40 21 Q56 22 57 38 Q56 28 50 24 Q44 20 40 20 Q36 20 30 24 Q24 28 23 38Z" fill="#3B2A1A"/>
