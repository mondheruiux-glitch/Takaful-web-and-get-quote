  <path d="M23 38 Q21 42 23 46 Q25 42 25 38Z" fill="#3B2A1A"/>
  <path d="M57 38 Q59 42 57 46 Q55 42 55 38Z" fill="#3B2A1A"/>
  <!-- Eyes -->
  <ellipse cx="34" cy="42" rx="2.5" ry="2.5" fill="#3B2A1A"/>
  <ellipse cx="46" cy="42" rx="2.5" ry="2.5" fill="#3B2A1A"/>
