  <path d="M31 39 Q34 37.5 37 39" stroke="#3B2A1A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M43 39 Q46 37.5 49 39" stroke="#3B2A1A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M39 46 Q40 47.5 41 46" stroke="#B5733A" stroke-width="1" fill="none"/>
  <!-- Neutral/slight smile -->
  <path d="M36 51.5 Q40 54.5 44 51.5" stroke="#B5733A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Beard/stubble hint -->
  <ellipse cx="40" cy="55" rx="7" ry="3" fill="#B5733A" opacity="0.15"/>
