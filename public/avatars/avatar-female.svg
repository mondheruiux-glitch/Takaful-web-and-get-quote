  <path d="M31.5 39.5 Q34 38.5 36.5 39.5" stroke="#3B2A1A" stroke-width="1" fill="none"/>
  <path d="M43.5 39.5 Q46 38.5 48.5 39.5" stroke="#3B2A1A" stroke-width="1" fill="none"/>
