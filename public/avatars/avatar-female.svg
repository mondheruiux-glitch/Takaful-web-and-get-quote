  <!-- Smile -->
  <path d="M35 51 Q40 55 45 51" stroke="#D4956A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Blush -->
  <ellipse cx="31" cy="48" rx="4" ry="2.5" fill="#F9A8D4" opacity="0.4"/>
  <ellipse cx="49" cy="48" rx="4" ry="2.5" fill="#F9A8D4" opacity="0.4"/>
</svg>
